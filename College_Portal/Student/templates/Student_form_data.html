
<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body style="background-color: #eaf2f8; font-family: Arial;">

    <h1 style="text-align: center; color: navy;">
        Student Registration Form
    </h1>

    <form method="POST"
          style="background-color: white;
                 width: 350px;
                 margin: auto;
                 padding: 25px;
                 border-radius: 10px;
                 box-shadow: 0 0 10px gray;">

        {% csrf_token %}

        <div style="color: black; font-size: 16px;">
            {{ form.as_p }}
        </div>

        <button type="submit"
                style="background-color: blue;
                       color: white;
                       padding: 10px 25px;
                       border: none;
                       border-radius: 5px;
                       cursor: pointer;">
            Save
        </button>

    </form>

</body>
</html>
