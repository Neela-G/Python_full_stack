
<!DOCTYPE html>
<html>
<head>
    <title>ABC Bank - Registration</title>
</head>
<body>

    <h1>AMRITH BANK</h1>
    <h2>Create Your Account</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</body>
</html>
